<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <title>Osteopathy &amp; Wellbeing @CT6 | Osteopath in Herne Bay, Kent</title>
    <meta
      name="description"
      content="Osteopathy, sports massage, acupuncture and rehabilitation in Herne Bay, Kent. Osteopaths registered with the General Osteopathic Council. Book an assessment today."
    />
    <meta name="author" content="Osteopathy &amp; Wellbeing @CT6" />
    <!--
      STAGING GUARD - remove this line when the clinic's real domain goes live.
      While this copy sits on a temporary hosting address it must never be
      indexed, or it would compete with the clinic's real site in search
      results. PageMeta.tsx recognises the data-staging-guard attribute and
      leaves this tag alone.
    -->
    <meta name="robots" content="noindex" data-staging-guard />
    <meta name="keywords" content="osteopath, Herne Bay, Kent, massage, acupuncture, sports massage, physiotherapy, osteopathy treatment, GOsC registered" />

    <!--
      THE SITE'S ONE ADDRESS: https://osteopathyandwellbeing.co.uk
      Every absolute URL in this file - the canonical link, the og/twitter
      tags, the structured data - is that exact string. It cannot live in a
      script constant, because the crawlers that read these tags (Google,
      Facebook, WhatsApp) do not execute JavaScript; if the domain ever
      changes it is one find-and-replace of the address above.
    -->
    <link rel="canonical" href="https://osteopathyandwellbeing.co.uk/" />

    <!--
      Icons. These are the practice's own @6t emblem, lifted from the master
      logo film and pushed in contrast so the mark still reads at 16 pixels in
      a browser tab. They previously drew the letters "CT6" on a plain tile —
      a placeholder from the template, not the practice's logo.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Social previews. The crawlers behind share cards (Facebook, WhatsApp,
      LinkedIn, X) read this static file and do not run JavaScript, so
      whichever page of the site is shared, the preview shows THESE values -
      the per-page titles set in src/components/PageMeta.tsx reach browsers
      and search engines only. Until the site is prerendered, this stays the
      truest whole-clinic description rather than pretending to be any one
      page.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Osteopathy &amp; Wellbeing @CT6" />
    <meta property="og:title" content="Osteopathy &amp; Wellbeing @CT6 | Osteopath in Herne Bay, Kent" />
    <meta
      property="og:description"
      content="Osteopathy, sports massage, acupuncture and rehabilitation at 180 High Street, Herne Bay, Kent. Osteopaths registered with the General Osteopathic Council. Call 01227 366473 or book online."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://osteopathyandwellbeing.co.uk/" />
    <meta property="og:image" content="https://osteopathyandwellbeing.co.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Osteopathy &amp; Wellbeing @CT6 — Herne Bay, Kent." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Osteopathy &amp; Wellbeing @CT6 | Osteopath in Herne Bay, Kent" />
    <meta
      name="twitter:description"
      content="Osteopathy, sports massage, acupuncture and rehabilitation in Herne Bay, Kent. Osteopaths registered with the General Osteopathic Council."
    />
    <meta name="twitter:image" content="https://osteopathyandwellbeing.co.uk/og-image.png" />

    <link rel="preconnect" href="https://images.unsplash.com" />

    <!--
      The typefaces are served from this site (see src/index.css). These two
      carry the first screenful — the headings and the body text — so they are
      fetched at the same moment as the stylesheet rather than after it, which
      is what stops the writing rendering in a fallback and then reflowing.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-500-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400-normal.woff2" crossorigin />

    <!--
      Structured data. This is what lets Google show the practice as a local
      business — address, phone, opening hours — rather than just a web page.
      Every value here is the practice's own published detail.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalBusiness",
        "@id": "https://osteopathyandwellbeing.co.uk/#clinic",
        "name": "Osteopathy & Wellbeing @CT6",
        "legalName": "Osteopathy & Wellbeing @CT6 Limited",
        "description": "Osteopathy, acupuncture, sports massage, reflexology, Swedish massage, physiotherapy, hypnotherapy and foot care in Herne Bay, Kent. Osteopaths registered with the General Osteopathic Council.",
        "medicalSpecialty": "PhysicalTherapy",
        "image": "https://osteopathyandwellbeing.co.uk/og-image.png",
        "logo": "https://osteopathyandwellbeing.co.uk/pwa-512x512.png",
        "url": "https://osteopathyandwellbeing.co.uk/",
        "sameAs": [
          "https://osteopathyandwellbeing.co.uk",
          "https://www.facebook.com/osteoCT6",
          "https://www.youtube.com/@OsteopathyWellbeingCT6HerneBay"
        ],
        "telephone": "+441227366473",
        "email": "info@osteopathyandwellbeing.co.uk",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "180 High Street",
          "addressLocality": "Herne Bay",
          "addressRegion": "Kent",
          "postalCode": "CT6 5AJ",
          "addressCountry": "GB"
        },
        "areaServed": { "@type": "AdministrativeArea", "name": "Kent, United Kingdom" },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "20:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Saturday"],
            "opens": "08:00",
            "closes": "12:00"
          }
        ],
        "availableService": [
          { "@type": "MedicalTherapy", "name": "Osteopathy" },
          { "@type": "MedicalTherapy", "name": "Acupuncture" },
          { "@type": "MedicalTherapy", "name": "Sports Massage" },
          { "@type": "MedicalTherapy", "name": "Physiotherapy" },
          { "@type": "MedicalTherapy", "name": "Reflexology" },
          { "@type": "MedicalTherapy", "name": "Swedish Massage" },
          { "@type": "MedicalTherapy", "name": "Hypnotherapy" },
          { "@type": "MedicalTherapy", "name": "Foot Care" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
